name: RunKit
options:
  bundleIdPrefix: com.ferrixguild
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
  createIntermediateGroups: true

settings:
  base:
    MARKETING_VERSION: "0.50"
    CURRENT_PROJECT_VERSION: "1"
    # No DEVELOPMENT_TEAM here on purpose: an empty string is still a value and
    # overrides what `xcode-project use-profiles` writes per target during the
    # signed build. The unsigned build needs none (CODE_SIGNING_ALLOWED=NO).
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1,2"

targets:
  RunKit:
    type: application
    platform: iOS
    sources:
      - path: RunKit
    dependencies:
      - target: RunKitWidgets
      # A watchOS app is embedded in the iOS app bundle under Watch/ — it is not a
      # separate App Store product and not a separate TestFlight build. `copy` is
      # required: without the explicit subpath XcodeGen embeds it like a framework
      # and the archive fails validation.
      - target: RunKitWatch
        embed: true
        copy:
          destination: productsDirectory
          subpath: "$(CONTENTS_FOLDER_PATH)/Watch"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ferrixguild.runkit
        INFOPLIST_FILE: RunKit/Info.plist
        CODE_SIGN_ENTITLEMENTS: RunKit/RunKit.entitlements
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
        CODE_SIGN_STYLE: Automatic

  RunKitWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: RunKitWidgets
      - path: RunKit/Shared/RunActivityAttributes.swift   # shared with the app target
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ferrixguild.runkit.widgets
        INFOPLIST_FILE: RunKitWidgets/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_STYLE: Automatic

  # The watch app records its own runs, so it links the real card model rather than
  # a parallel copy. Those files are listed one by one instead of globbing a folder:
  # most of RunKit/ imports UIKit or SwiftData and will not compile for watchOS, so
  # membership has to be a deliberate, reviewable list.
  RunKitWatch:
    type: application
    platform: watchOS
    sources:
      - path: RunKitWatch
      - path: RunKit/Shared/WatchMenu.swift          # menu wire format
      - path: RunKit/Shared/WatchSession.swift       # finished-run wire format
      - path: RunKit/Shared/AutoPause.swift          # same thresholds on both devices
      - path: RunKit/Shared/RecordingOwner.swift     # stops both devices recording one run
      - path: RunKit/Models/ActivitySegment.swift    # the card model itself
      - path: RunKit/Enums/ActivityType.swift
      - path: RunKit/Enums/WorkoutType.swift
      - path: RunKit/Enums/WorkoutRecipe.swift
      - path: RunKit/Services/UnitSystem.swift
      - path: RunKit/Services/HeartRateZones.swift   # zone bounds for HR cards
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ferrixguild.runkit.watchkitapp
        INFOPLIST_FILE: RunKitWatch/Info.plist
        CODE_SIGN_ENTITLEMENTS: RunKitWatch/RunKitWatch.entitlements
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        # Overrides the "1,2" in settings.base. Inheriting it silently produces a
        # watch app that will not install.
        TARGETED_DEVICE_FAMILY: "4"

schemes:
  RunKit:
    build:
      targets:
        RunKit: all
    run:
      config: Debug
    archive:
      config: Release
