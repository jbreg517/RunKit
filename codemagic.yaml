workflows:
  altstore-unsigned-ipa:
    name: RunKit — Unsigned IPA (AltStore)
    max_build_duration: 60

    environment:
      xcode: 16.2
      groups: []

    triggering:
      events:
        - push
        - pull_request
      branch_patterns:
        - pattern: master
          include: true

    scripts:
      - name: Install XcodeGen
        script: |
          set -eo pipefail
          # RunKit has no checked-in .xcodeproj — it's generated from project.yml.
          which xcodegen || brew install xcodegen
          xcodegen --version

      - name: Set version and build number
        script: |
          set -eo pipefail
          BUILD=$(git rev-list --count HEAD)
          VERSION=$(grep -oE 'static let current = "[0-9.]+"' RunKit/App/RunKitApp.swift | grep -oE '[0-9]+\.[0-9]+' | head -1)
          [ -z "$VERSION" ] && VERSION="0.01"
          echo "Version $VERSION, build $BUILD"
          # Inject into project.yml so the generated project carries them.
          /usr/bin/sed -i '' "s/MARKETING_VERSION: \"[0-9.]*\"/MARKETING_VERSION: \"$VERSION\"/" project.yml
          /usr/bin/sed -i '' "s/CURRENT_PROJECT_VERSION: \"[0-9]*\"/CURRENT_PROJECT_VERSION: \"$BUILD\"/" project.yml

      - name: Generate Xcode project
        script: |
          set -eo pipefail
          xcodegen generate
          # Mirror version/build into the Info.plist too.
          BUILD=$(git rev-list --count HEAD)
          VERSION=$(grep -oE 'static let current = "[0-9.]+"' RunKit/App/RunKitApp.swift | grep -oE '[0-9]+\.[0-9]+' | head -1)
          # Every embedded bundle must carry the SAME version as the host app —
          # a mismatch on the watch app is a hard App Store validation rejection.
          for PLIST in RunKit/Info.plist RunKitWidgets/Info.plist RunKitWatch/Info.plist; do
            [ -f "$PLIST" ] || continue
            /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $BUILD" "$PLIST" 2>/dev/null || true
            [ -n "$VERSION" ] && /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $VERSION" "$PLIST" 2>/dev/null || true
          done

      - name: Build unsigned archive
        script: |
          set -eo pipefail
          xcodebuild archive \
            -project RunKit.xcodeproj \
            -scheme RunKit \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$CM_BUILD_DIR/RunKit.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            OTHER_CODE_SIGN_FLAGS="--timestamp=none" \
            ALWAYS_EMBED_SWIFT_STANDARD_LIBRARIES=YES \
            ENABLE_PREVIEWS=NO \
            2>&1 | tee /tmp/xcodebuild.log
          if [ ! -d "$CM_BUILD_DIR/RunKit.xcarchive/Products/Applications" ]; then
            echo "ERROR: Archive produced no app bundle. Build failed."
            grep -E "error:|Build FAILED" /tmp/xcodebuild.log | tail -40
            exit 1
          fi

      - name: Package as unsigned .ipa for AltStore
        script: |
          set -eo pipefail
          APP_PATH=$(find "$CM_BUILD_DIR/RunKit.xcarchive/Products/Applications" -name "*.app" -maxdepth 1 | head -1)
          [ -z "$APP_PATH" ] && { echo "ERROR: No .app bundle found"; exit 1; }
          mkdir -p "$CM_BUILD_DIR/Payload"
          cp -r "$APP_PATH" "$CM_BUILD_DIR/Payload/"
          # Drop the embedded watch app from the sideload IPA. AltStore re-signs
          # with a free/dev profile that can't cover the watch app's own App ID, so
          # leaving it in tends to fail the install outright — and a watch app can
          # only really be tested through TestFlight anyway. The archive step above
          # still COMPILES the watch target, which is the signal we want here.
          rm -rf "$CM_BUILD_DIR/Payload/$(basename "$APP_PATH")/Watch"
          BUILD=$(git rev-list --count HEAD)
          VERSION=$(grep -oE 'static let current = "[0-9.]+"' RunKit/App/RunKitApp.swift | grep -oE '[0-9]+\.[0-9]+' | head -1)
          [ -z "$VERSION" ] && VERSION="0.00"
          IPA_NAME="RunKit_v${VERSION}_b${BUILD}.ipa"
          ditto -c -k --sequesterRsrc --keepParent "$CM_BUILD_DIR/Payload" "$CM_BUILD_DIR/$IPA_NAME"
          echo "IPA created: $CM_BUILD_DIR/$IPA_NAME"
          ls -lh "$CM_BUILD_DIR/$IPA_NAME"

    artifacts:
      - "$CM_BUILD_DIR/RunKit_v*_b*.ipa"
      - "/tmp/xcodebuild.log"

    publishing:
      email:
        recipients:
          - jbreg517@gmail.com
        notify:
          success: true
          failure: true

  # ---------------------------------------------------------------------------
  # Signed App Store / TestFlight build. Mirrors LiftKit's proven workflow.
  #
  # ONE-TIME SETUP IN THE CODEMAGIC UI (cannot be done from this file):
  #   1. Apple Developer Program enrollment, then register ALL THREE App IDs at
  #      developer.apple.com: `com.ferrixguild.runkit`, `com.ferrixguild.runkit.widgets`
  #      and `com.ferrixguild.runkit.watchkitapp`.
  #      On the app's App ID enable HealthKit. On the WATCH App ID enable HealthKit
  #      too — the watch records its own runs, so it needs the entitlement in its
  #      own right; inheriting the phone's does not happen.
  #      (Live Activities need no App ID
  #      toggle — they're driven by NSSupportsLiveActivities in Info.plist,
  #      already set. Only add Push Notifications if we later want the Live
  #      Activity updated by remote push; RunKit updates it locally, so skip.)
  #   2. App Store Connect API key: REUSE LiftKit's existing team-level
  #      integration `liftkit app manager` (already referenced below) — no new
  #      key needed. Just confirm its role reaches the new RunKit app record.
  #   3. Create the RunKit app record in App Store Connect (gives TestFlight a
  #      target). Bundle ID = com.ferrixguild.runkit.
  #   4. `signing` env-var group with CERTIFICATE_PRIVATE_KEY: REUSE the SAME PEM
  #      key value LiftKit uses. Same key => fetch-signing-files reuses the one
  #      Apple Distribution cert instead of minting a second (Apple caps certs).
  #      If Codemagic groups are global to the team, RunKit sees `signing` as-is;
  #      if app-scoped, recreate a `signing` group here with the identical value.
  #
  # Trigger: manual (no `triggering:` block) — runs only when started from the
  # Codemagic UI. Keeps it deliberate and saves build minutes.
  # ---------------------------------------------------------------------------
  ios-testflight:
    name: RunKit — TestFlight (signed)
    max_build_duration: 60

    integrations:
      # Reuses the shared Ferrixguild App Store Connect API key already set up for
      # LiftKit (team-level integration, covers all apps under the org). Same key
      # => fetch-signing-files reuses the ONE Apple Distribution cert for the suite.
      app_store_connect: "liftkit app manager"   # <-- must EXACTLY match the integration name in Codemagic UI

    environment:
      # App Store submissions must build with the iOS 26 SDK (required since
      # Apr 2026), so the signed workflow tracks the latest Xcode.
      xcode: latest
      groups:
        - signing   # must define CERTIFICATE_PRIVATE_KEY (a distribution-cert private key)

    scripts:
      - name: Install XcodeGen + set version, then generate project
        script: |
          set -eo pipefail
          which xcodegen || brew install xcodegen
          BUILD=$(git rev-list --count HEAD)
          VERSION=$(grep -oE 'static let current = "[0-9.]+"' RunKit/App/RunKitApp.swift | grep -oE '[0-9]+\.[0-9]+' | head -1)
          [ -z "$VERSION" ] && VERSION="0.01"
          echo "Version $VERSION, build $BUILD"
          /usr/bin/sed -i '' "s/MARKETING_VERSION: \"[0-9.]*\"/MARKETING_VERSION: \"$VERSION\"/" project.yml
          /usr/bin/sed -i '' "s/CURRENT_PROJECT_VERSION: \"[0-9]*\"/CURRENT_PROJECT_VERSION: \"$BUILD\"/" project.yml
          xcodegen generate
          # Mirror version/build into every Info.plist — the app, the widget and
          # the watch app must all report the same version or the upload is
          # rejected at validation.
          for PLIST in RunKit/Info.plist RunKitWidgets/Info.plist RunKitWatch/Info.plist; do
            [ -f "$PLIST" ] || continue
            /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $BUILD" "$PLIST" 2>/dev/null || true
            [ -n "$VERSION" ] && /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $VERSION" "$PLIST" 2>/dev/null || true
          done

      - name: Set up code signing
        script: |
          set -eo pipefail
          # Manual App Store signing via the app_store_connect API key. Fetch —
          # creating if missing — an App Store profile + distribution cert for
          # BOTH the app and the widget extension, add the cert to the build
          # keychain, then point the project at the fetched profiles.
          #
          # PREREQUISITE: both App IDs must already be registered at
          # developer.apple.com, and `com.ferrixguild.runkit` must have HealthKit
          # enabled — else the created profile won't carry that entitlement and
          # the build fails with a "doesn't include the … entitlement" error.
          keychain initialize
          app-store-connect fetch-signing-files "com.ferrixguild.runkit" \
            --type IOS_APP_STORE \
            --certificate-key=@env:CERTIFICATE_PRIVATE_KEY \
            --create
          app-store-connect fetch-signing-files "com.ferrixguild.runkit.widgets" \
            --type IOS_APP_STORE \
            --certificate-key=@env:CERTIFICATE_PRIVATE_KEY \
            --create
          # The watch app is its own App ID and needs its own profile, but the type
          # is IOS_APP_STORE — App Store Connect registers watchOS bundle IDs under
          # platform IOS, and there is no WATCH_APP_STORE profile type (the
          # platform-specific variants are MAC_* and TVOS_* only).
          #
          # This call is belt-and-braces: `fetch-signing-files` matches the bundle
          # ID as a PREFIX unless given --strict-match-identifier, so the first call
          # above already picks up .widgets and .watchkitapp too. Keeping it
          # explicit means a future rename can't silently drop the watch profile.
          app-store-connect fetch-signing-files "com.ferrixguild.runkit.watchkitapp" \
            --type IOS_APP_STORE \
            --certificate-key=@env:CERTIFICATE_PRIVATE_KEY \
            --create
          keychain add-certificates
          xcode-project use-profiles
          # Show what actually got fetched and applied — if the widget's App ID
          # is missing or unprovisioned, it shows up here rather than as an
          # opaque archive failure.
          echo "===== provisioning profiles on disk ====="
          ls -1 ~/Library/MobileDevice/Provisioning\ Profiles/ 2>/dev/null || echo "(none)"
          echo "===== signing identities ====="
          security find-identity -v -p codesigning | head -20
          echo "===== export options ====="
          cat ~/export_options.plist 2>/dev/null || echo "(no export_options.plist)"

      - name: Archive (signed)
        script: |
          # Run xcodebuild directly rather than `xcode-project build-ipa`: the
          # wrapper reports only "Failed to archive" + status 65 and keeps its
          # log somewhere we couldn't grep, so a failure gave us nothing to work
          # with. Teeing our own log guarantees the real errors are visible.
          # pipefail only (no `set -e`) so the grep below always runs.
          set -o pipefail
          xcodebuild archive \
            -project RunKit.xcodeproj \
            -scheme RunKit \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$CM_BUILD_DIR/RunKit.xcarchive" \
            COMPILER_INDEX_STORE_ENABLE=NO \
            2>&1 | tee /tmp/archive.log
          STATUS=${PIPESTATUS[0]}
          if [ "$STATUS" -ne 0 ] || [ ! -d "$CM_BUILD_DIR/RunKit.xcarchive" ]; then
            echo "===== ARCHIVE FAILED (status $STATUS) — errors below ====="
            grep -E "error:|Build FAILED|ARCHIVE FAILED|Undefined symbol|no profile|No profile|doesn't include|provisioning|Signing|requires a development team" /tmp/archive.log | tail -80
            echo "===== last 40 lines of raw log ====="
            tail -40 /tmp/archive.log
            exit 1
          fi

      - name: Export IPA
        script: |
          set -o pipefail
          # `use-profiles` wrote ~/export_options.plist during the signing step.
          xcodebuild -exportArchive \
            -archivePath "$CM_BUILD_DIR/RunKit.xcarchive" \
            -exportPath build/ios/ipa \
            -exportOptionsPlist ~/export_options.plist \
            2>&1 | tee /tmp/export.log
          STATUS=${PIPESTATUS[0]}
          if [ "$STATUS" -ne 0 ]; then
            echo "===== EXPORT FAILED (status $STATUS) ====="
            tail -60 /tmp/export.log
            exit 1
          fi
          ls -lh build/ios/ipa/

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/archive.log
      - /tmp/export.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        # To push straight to external testers, list beta group names here:
        # beta_groups:
        #   - "External Testers"
      email:
        recipients:
          - jbreg517@gmail.com
